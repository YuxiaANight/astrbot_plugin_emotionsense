<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#EDFFEC">
    <title>情绪感知面板</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <h1>情绪感知面板</h1>

        <div id="stats">
            <div class="stat-card">
                <span class="stat-label">总用户数</span>
                <span class="stat-value" id="totalUsers">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">当前负面情绪</span>
                <span class="stat-value" id="negativeCount">0</span>
            </div>
        </div>

        <div class="section-title">机器人情绪</div>
        <div id="llmCurrent" class="llm-card">
            <div class="llm-emotion" id="llmEmotion">--</div>
            <div class="llm-meta">
                <span class="llm-score" id="llmScore">强度 --</span>
                <span class="llm-time" id="llmTime">尚未产生情绪</span>
            </div>
        </div>

        <div class="section-title">情绪变化状态</div>
        <div id="llmHistoryWrap" class="history-wrap">
            <ul id="llmHistory" class="history-list">
                <li class="empty-history">暂无变化记录</li>
            </ul>
        </div>

        <div id="statusBar" class="status" hidden></div>
        <div id="controls">
            <button id="refreshBtn" type="button">刷新数据</button>
            <button id="clearBtn" class="danger" type="button">清除所有数据</button>
        </div>

        <div class="section-title">用户情绪明细</div>
        <div id="tableWrap">
            <table>
                <thead>
                    <tr>
                        <th>用户ID</th>
                        <th>当前情绪</th>
                        <th>情绪强度</th>
                        <th>记录数</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row"><td colspan="4">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="confirmModal" class="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true">
            <p id="modalText"></p>
            <div class="modal-actions">
                <button id="modalCancel" type="button">取消</button>
                <button id="modalConfirm" class="danger" type="button">确定</button>
            </div>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
